[package]
name = "rustfox"
version = "0.1.0"
edition = "2024"
description = "Rust rewrite of the openfox agentic coding assistant"
license = "MIT"
rust-version = "1.85"

[[bin]]
name = "rustfox"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }
tower = { version = "0.5", features = ["util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", features = ["json", "stream"], default-features = false }
futures-util = "0.3"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
axum = { version = "0.8", features = ["ws", "json"] }

[profile.release]
opt-level = 2
lto = "thin"
